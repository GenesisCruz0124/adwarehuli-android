name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/adwarehuli-android-app-r1sdjn

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Publish "latest" release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from ${{ github.sha }} on branch ${{ github.ref_name }}.
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
